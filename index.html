<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Investimentos em tecnologia 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FFFFFF;--card:#FFFFFF;--ink:#0B0B0B;--mut:#6B6B6B;--line:#E4E4E2;
  --blue:#0B0B0B;--blue2:#3B3B3B;--blue-t:#F3F3F1;
  --acc:#FFD100;--acc-d:#0B0B0B;--acc-t:#FFF6BF;
  --amb:#0B0B0B;--amb-t:#FFF6BF;--amb-l:#FFD100;--red:#0B0B0B;--grn:#0B0B0B;
  --y:#FFD100;--g1:#F3F3F1;--g2:#E4E4E2;--g3:#BDBDBD;--g4:#8A8A8A;
  --head:"ApproxSafe","Gotham","Gotham SSm","Montserrat","Helvetica Neue",Arial,sans-serif;
  --body:"ApproxSafe","Gotham","Gotham SSm","Montserrat","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;font-size:17px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--amb-l);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#stage{position:fixed;inset:0}
.slide{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(env(safe-area-inset-top,0px) + 60px) 5vw 130px;opacity:0;visibility:hidden;transform:translateX(4%);transition:opacity .5s,transform .55s cubic-bezier(.2,.7,.2,1),visibility 0s .55s}
.slide[data-s="before"]{transform:translateX(-4%)}
.slide.on{opacity:1;visibility:visible;transform:none;transition:opacity .5s .06s,transform .55s cubic-bezier(.2,.7,.2,1) .06s,visibility 0s}
.in{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:1.3rem}
.hd{display:flex;align-items:center;gap:1rem}
.step{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font:600 1.2rem var(--head)}
h2{font:300 clamp(1.9rem,4.2vw,3.2rem)/1.05 var(--head);margin:0;color:var(--blue);letter-spacing:-.01em}
h2 b{font-weight:600}
.rv{opacity:0;transform:translateY(20px);transition:opacity .55s,transform .65s cubic-bezier(.2,.7,.2,1)}
.slide.on .rv{opacity:1;transform:none;transition-delay:calc(var(--i,0)*90ms + 250ms)}
.big{font:300 clamp(2.4rem,6vw,5rem)/1 var(--head);font-variant-numeric:tabular-nums;color:var(--blue)}
.big small{font-size:.35em;font-weight:400;color:var(--mut)}
.acc{color:var(--acc-d)}
.lbl{font-weight:700;font-size:.95rem}
.mut{color:var(--mut)}
.note{font-size:.88rem;color:var(--mut)}
.tag{display:inline-flex;gap:.3rem;align-items:center;font:700 .74rem/1 var(--body);padding:.3rem .6rem;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap;vertical-align:middle}
.tag.est{color:var(--amb);background:var(--amb-t)}.tag.est::before{content:"≈"}
.tag.val{color:var(--amb);border-style:dashed}.tag.val::before{content:"?"}
.tag.meta{color:var(--blue2);background:var(--blue-t)}.tag.meta::before{content:"◎"}
.tag.hist{color:var(--amb);background:var(--amb-t)}.tag.hist::before{content:"▤"}
.tag.hip{color:var(--mut);border-style:dotted}.tag.hip::before{content:"△"}
.tag.ok{color:var(--grn)}.tag.ok::before{content:"✓"}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.ic{width:3rem;height:3rem;flex:none}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;gap:1rem}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.base{border-radius:14px;padding:.8rem 1.2rem;font-weight:700;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.base.acc-b{background:var(--acc);color:#fff}.base.blue-b{background:var(--blue);color:#fff}.base.amb-b{background:var(--amb-t);border:1.5px solid var(--amb-l);color:#000000}
.src{font-size:.8rem;color:var(--mut)}
/* botão detalhes */
.more{align-self:flex-start;border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:999px;padding:.55rem 1.3rem;font-weight:700;display:inline-flex;gap:.6rem;align-items:center;transition:background .2s}
.more:hover{background:var(--blue-t)}.more .ch{transition:transform .3s}.more[aria-expanded="true"] .ch{transform:rotate(180deg)}
.dt{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s ease}
.dt.open{grid-template-rows:1fr}
.dt>div{overflow:hidden;min-height:0}
.dt:not(.open)>div{visibility:hidden}
.dtin{padding:1.2rem;margin-top:.4rem;border:2px solid var(--blue);border-radius:18px;background:#fff}
.dtin h3{font:600 1.25rem var(--head);color:var(--blue);margin:0 0 .6rem}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.9rem}
.tabs button{border:1.5px solid var(--blue);background:#fff;color:var(--blue);border-radius:999px;padding:.4rem 1rem;font-weight:700}
.tabs button[aria-pressed="true"]{background:var(--blue);color:#fff}
.pn{display:none}.pn.on{display:block}
/* S1 */
.duo{display:grid;grid-template-columns:1fr auto 1fr;gap:0;align-items:stretch}
.area{border-radius:24px;padding:1.6rem 1.6rem;display:flex;flex-direction:column;gap:1rem}
.area h3{margin:0;font:600 1.7rem var(--head)}
.area.d{background:var(--acc);color:#fff}.area.n{background:var(--blue);color:#fff}
.chips{display:grid;gap:.7rem}
.chip{display:flex;align-items:center;gap:.8rem;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.5);border-radius:14px;padding:.7rem 1rem;font:600 1.25rem var(--head)}
.chip .ic{width:2.3rem;height:2.3rem}
.link{display:flex;flex-direction:column;align-items:center;justify-content:center;width:5.5rem;position:relative}
.link::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:4px dashed var(--blue2)}
.link span{position:relative;top:-1.5rem;padding:.1rem .3rem;font-weight:700;font-size:.8rem;color:var(--blue2);text-align:center;line-height:1.1}
/* S2 */
.hub{display:flex;flex-direction:column;align-items:center;gap:.6rem;padding:1.4rem;text-align:center}
.hub .big{font-size:clamp(3rem,9vw,7rem)}
.cc{padding:1.1rem;display:flex;flex-direction:column;gap:.5rem;align-items:flex-start;position:relative}
.cc::before{content:"";position:absolute;top:-1rem;left:50%;height:1rem;border-left:3px solid var(--blue2)}
.cc h3{margin:0;font:600 1.5rem var(--head)}
.cc.g{border-style:dashed;border-width:2px}
/* S3 */
.tl{display:grid;grid-template-columns:repeat(12,1fr);gap:.55rem 0;padding:.5rem 0}
.mo{text-align:center;font-weight:700;font-size:.8rem;color:var(--mut);border-bottom:2px solid var(--line);padding-bottom:.3rem}
.ms{border-radius:16px;padding:.7rem 1rem;color:#fff;display:flex;gap:.8rem;align-items:center;margin:0 .2rem;transform:scaleX(0);transform-origin:left;transition:transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i)*160ms + 500ms)}
.slide.on .ms{transform:none}
.ms b{display:block;font:600 1rem var(--head);letter-spacing:.02em}.ms span{font-size:.92rem}
.ms .ic{width:1.9rem;height:1.9rem}
.ms.a{background:var(--acc)}.ms.b{background:var(--blue)}.ms.c{background:var(--blue2)}.ms.d{background:#fff;color:var(--blue);border:2.5px solid var(--acc)}
/* S4 */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:center}
.vs .card{padding:1.3rem 1.6rem;text-align:center}
.vs .big{font-size:clamp(2rem,4.4vw,3.8rem);white-space:nowrap}
.vs .arrow{font:300 3rem var(--head);color:var(--acc-d)}
.hl{background:linear-gradient(135deg,var(--acc),var(--acc-d));color:#fff;border-radius:20px;padding:1rem 1.6rem;display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap}
.hl .big{color:#fff;font-size:clamp(2.4rem,6vw,4.4rem)}
.chart svg{width:100%;height:auto;display:block}.chart text{font-family:var(--body);fill:var(--ink)}
.bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i)*60ms + 200ms)}
.dt.open .bar{transform:none}
.drawn{stroke-dasharray:2000;stroke-dashoffset:2000;transition:stroke-dashoffset 2s ease .3s}.dt.open .drawn{stroke-dashoffset:0}
.stk{display:flex;height:2.6rem;border-radius:12px;overflow:hidden;background:#ECECEA}.stk i{display:block;height:100%;transition:width 1s}
.leg{display:flex;gap:1rem;flex-wrap:wrap;font-weight:600;font-size:.92rem;margin:.4rem 0}.leg span::before{content:"";display:inline-block;width:.8rem;height:.8rem;border-radius:3px;background:var(--c);margin-right:.4rem}
.rates{display:flex;gap:.6rem;flex-wrap:wrap}.rate{background:var(--blue);color:#fff;border-radius:14px;padding:.5rem 1.1rem;text-align:center}.rate b{display:block;font:300 2.4rem/1 var(--head)}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}table.t th,table.t td{padding:.4rem .6rem;border-bottom:1px solid var(--line);text-align:right}table.t th:first-child,table.t td:first-child{text-align:left}table.t th{background:var(--blue);color:#fff}table.t tr.tt td{font-weight:700;background:var(--blue-t)}
.wf{display:grid;grid-template-columns:minmax(140px,28%) 1fr;gap:.4rem .8rem;align-items:center}
.hb{height:1.7rem;border-radius:6px}
.sl{margin:.4rem 0}.sl label{display:flex;justify-content:space-between;font-weight:600}.sl input{width:100%;accent-color:var(--acc)}
.sb{display:flex;height:2.1rem;border-radius:8px;overflow:hidden;background:#ECECEA;position:relative}.sb i{display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff;font-weight:700;font-size:.78rem;overflow:hidden;white-space:nowrap;transition:width .4s}
.mk{position:absolute;top:-3px;bottom:-3px;border-left:3px dashed var(--red)}
.stk2{display:grid;grid-template-columns:minmax(120px,26%) 1fr;gap:.4rem .8rem;align-items:center}
.seg{display:flex;gap:.4rem;flex-wrap:wrap}.seg button{border:1.5px solid var(--blue);background:#fff;color:var(--blue);border-radius:999px;padding:.3rem .8rem;font-weight:700}.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
/* S5 */
.inv{display:flex;gap:1.4rem;align-items:center;flex-wrap:wrap}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.fi{padding:1rem;display:flex;flex-direction:column;align-items:center;gap:.4rem;font:600 1.15rem var(--head);color:var(--acc-d)}.fi .ic{width:3.6rem;height:3.6rem}
.org{width:100%;height:auto;max-height:340px}.org .nd rect{fill:#fff;stroke:#BDBDBD;stroke-width:1.5;transition:all .4s}.org .nd text{fill:var(--ink);font:600 15px var(--body);text-anchor:middle}
.org .nd.on rect{fill:var(--acc);stroke:var(--acc-d)}.org .nd.on text{fill:#fff}.org .nd:not(.on){opacity:.45}.org .nd.sel rect{stroke:var(--amb-l);stroke-width:4}.org .nd{cursor:pointer}.org .ln{stroke:#BDBDBD;stroke-width:1.5;fill:none}
.pills{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem}.pills button{border:1.5px solid var(--acc-d);background:#fff;color:var(--acc-d);border-radius:999px;padding:.4rem 1rem;font-weight:700}.pills button[aria-pressed="true"]{background:var(--acc-d);color:#fff}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}.cols3>div{border:1.5px solid var(--line);border-radius:14px;padding:.8rem 1rem}
.cols3 h4{margin:0 0 .3rem;font:600 1.05rem var(--head);color:var(--blue)}
.gb{display:grid;grid-template-columns:minmax(120px,22%) 1fr auto;gap:.8rem;align-items:center;width:100%;background:none;border:0;border-radius:12px;padding:.45rem .4rem;text-align:left}
.gb:hover{background:var(--blue-t)}.gb[aria-expanded="true"]{background:var(--blue-t)}
.gb .tr{height:1.6rem;background:#ECECEA;border-radius:999px;overflow:hidden}.gb .tr i{display:block;height:100%;border-radius:999px;width:0;transition:width 1s}
.gb b{font:600 1.7rem var(--head);color:var(--blue);min-width:7.5rem;text-align:right}
.gb b small{font-size:.5em;font-weight:400;color:var(--mut)}
.blk{margin:.8rem 0 .2rem}.blk h4{margin:0;display:flex;justify-content:space-between;gap:1rem;font-size:1.05rem}.blk h4 span:last-child{color:var(--mut);font-weight:400}.blk p{margin:.1rem 0 .3rem;color:var(--mut);font-size:.92rem}
.itm{display:grid;grid-template-columns:1fr auto;gap:0 1rem;padding:.45rem 0;border-bottom:1px dashed var(--line)}.itm b{font-size:1rem}.itm i{grid-row:1/3;grid-column:2;font:700 1.1rem var(--body);font-style:normal;color:var(--blue);align-self:center}.itm span{color:var(--mut);font-size:.92rem}
.ctl{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;margin-bottom:.6rem}
.ctl input[type=search]{padding:.5rem .9rem;border-radius:999px;border:1.5px solid var(--line);min-width:230px;font:inherit}
.btn{border:1.5px solid var(--blue);background:#fff;color:var(--blue);border-radius:999px;padding:.45rem 1rem;font-weight:700}.btn:hover{background:var(--blue-t)}
/* S6 */
.rc{padding:1.3rem 1.4rem;display:flex;flex-direction:column;gap:.4rem}.rc .big{font-size:clamp(2.4rem,5vw,4rem)}
.fil{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem}.fil button{border:1.5px solid var(--blue);background:#fff;color:var(--blue);border-radius:999px;padding:.35rem .9rem;font-weight:700;font-size:.9rem}.fil button[aria-pressed="true"]{background:var(--blue);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.7rem}
.tile{border:1.5px solid var(--line);border-radius:14px;padding:.7rem .9rem;background:#fff;border-top:5px solid var(--blue2);transition:opacity .3s,transform .3s}.tile.off{display:none}
.tile b{display:block;font:600 1.9rem/1.1 var(--head);color:var(--blue)}.tile p{margin:.15rem 0 .4rem;font-size:.9rem;line-height:1.25}
.tile.meta{border-top-color:var(--acc)}.tile.hip{border-top-color:#8A8A8A;border-style:dashed}
/* S7 */
.ask{padding:1.3rem;display:flex;gap:1rem;align-items:center}.ask .ic{width:4rem;height:4rem;color:var(--acc-d)}.ask h3{margin:0;font:600 1.5rem var(--head)}
.fin{font:300 clamp(1.7rem,3.8vw,2.8rem)/1.1 var(--head);color:var(--blue)}.fin b{font-weight:600;color:var(--acc-d)}
.cloud{display:flex;flex-wrap:wrap;gap:.3rem .9rem;justify-content:center;padding:.4rem}
.w{background:none;border:0;font-family:var(--head);font-weight:400;padding:.1rem .3rem;border-radius:10px;color:var(--c);animation:fl 7s ease-in-out infinite;animation-delay:var(--d)}.w:hover,.w[aria-pressed="true"]{background:var(--blue-t)}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.defb{background:var(--blue-t);border-radius:12px;padding:.8rem 1rem;min-height:3.4rem}
.gt{display:grid;grid-template-columns:minmax(140px,26%) repeat(12,1fr);row-gap:.4rem;align-items:center;font-size:.88rem}.gt .m{text-align:center;font-weight:700;color:var(--mut);font-size:.8rem}
.gt .bb{min-height:1.9rem;border-radius:999px;padding:.3rem .9rem;display:flex;align-items:center;text-align:left;font-weight:700;font-size:.78rem;line-height:1.15;color:#fff;white-space:normal;cursor:pointer;transition:transform .2s,box-shadow .2s,filter .2s}
.gt .bb:hover{filter:brightness(1.08);transform:translateY(-1px)}.gt .bb.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--blue)}
.gt.pulse .bb{animation:bbp 1.3s ease-in-out 2}.gt.pulse .bb:nth-of-type(2){animation-delay:.12s}.gt.pulse .bb:nth-of-type(3){animation-delay:.24s}.gt.pulse .bb:nth-of-type(4){animation-delay:.36s}.gt.pulse .bb:nth-of-type(5){animation-delay:.48s}.gt.pulse .bb:nth-of-type(6){animation-delay:.6s}
@keyframes bbp{0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,.08)}50%{box-shadow:0 0 0 6px rgba(0,0,0,.08)}}
.gtc{padding:1.2rem 1.4rem}.gthd{display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap;margin-bottom:.9rem}.gthd h3{margin:0;font:600 1.3rem var(--head);color:var(--blue)}
.hint{display:inline-flex;gap:.4rem;align-items:center;background:none;border:1px dashed #BDBDBD;color:var(--mut);border-radius:999px;padding:.3rem .8rem;font-size:.8rem;font-weight:600;transition:color .2s,border-color .2s}.hint:hover{color:var(--blue);border-color:var(--blue)}.hint svg{width:.95rem;height:.95rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.gtn{margin-top:1rem;min-height:3.4rem;background:var(--blue-t);border-radius:12px;padding:.8rem 1rem;color:var(--mut);display:block;line-height:1.4}.gtn.on{color:var(--ink);animation:cpop .4s ease both}

/* botão que abre janela de detalhes (tela 1) */
.mbtn{margin-left:auto;border:0;background:#fff;color:var(--acc-d);border-radius:999px;padding:.55rem 1.25rem;font-weight:700;display:inline-flex;gap:.5rem;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:transform .2s,box-shadow .2s}
.mbtn:hover{transform:translateX(2px);box-shadow:0 4px 14px rgba(0,0,0,.22)}
.prt{display:none}
.modal[hidden]{display:none}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 1rem) 1rem calc(env(safe-area-inset-bottom,0px) + 1rem)}
.mbk{position:absolute;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(3px)}
.mdl{position:relative;width:min(960px,100%);max-height:100%;display:flex;flex-direction:column;background:#fff;border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.08);overflow:hidden;animation:mi .3s cubic-bezier(.2,.7,.2,1)}
@keyframes mi{from{opacity:0;transform:translateY(16px) scale(.98)}}
.mhd{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem 1.3rem;border-bottom:1px solid var(--line);background:var(--bg)}
.mhd h3{margin:0;font:600 1.35rem var(--head);color:var(--blue)}
.mx{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;border:1.5px solid var(--blue);background:#fff;color:var(--blue);font-weight:700;font-size:1rem}.mx:hover{background:var(--blue-t)}
.mbd{padding:1.2rem 1.3rem 1.4rem;overflow-y:auto}
/* fluxo de transição */
.flow{margin-top:1rem;border:1px solid var(--line);border-radius:18px;background:#fff;padding:1.1rem 1.2rem}
.flow h4{margin:0 0 .9rem;font:600 1.2rem var(--head);color:var(--blue)}
.fsteps{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:.5rem;align-items:stretch}
.fs{border-radius:14px;padding:.9rem 1rem;background:var(--blue-t);border-top:5px solid var(--c);display:flex;flex-direction:column;gap:.15rem}
.fs .n{font:300 2.2rem/1 var(--head);color:var(--c)}
.fs b{font:600 1.15rem var(--head);color:var(--blue)}
.fs span:last-child{color:var(--mut);font-size:.95rem}
.fa{align-self:center;font:300 2.6rem/1 var(--head);color:var(--acc-d)}
.fmsg{margin-top:.9rem;background:var(--blue);color:#fff;border-radius:14px;padding:.8rem 1.1rem;font-weight:600;line-height:1.35}
@media (max-width:700px){.fsteps{grid-template-columns:1fr}.fa{transform:rotate(90deg);text-align:center}.mbtn{margin-left:0}}
/* calendário de campanhas (tela 2) */
.hub.s2h{padding:.5rem 1rem}.hub.s2h .big{font-size:clamp(2.4rem,5vw,3.6rem)}

.cal{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:1.3rem 1.4rem 1.1rem}
.calhd{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.1rem}
.calhd h3{margin:0;font:600 1.35rem var(--head);color:var(--blue)}.calhd p{margin:.15rem 0 0;font-size:.9rem;color:var(--mut)}
.cnt{display:flex;align-items:center;gap:.7rem}.cnt b{font:300 3.4rem/1 var(--head);color:var(--acc-d);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}.cnt span{font-size:.85rem;line-height:1.25;color:var(--mut);font-weight:600}
.cg{overflow-x:auto;padding-bottom:.3rem}
.cgi{min-width:760px;display:grid;grid-template-columns:7rem repeat(9,1fr);column-gap:.4rem;row-gap:.6rem;align-items:start}

.s4tt>div:first-child b{display:block;font-size:1rem}.s4tt>div:first-child span{display:block;font-size:.8rem;opacity:.88;line-height:1.3}.s4tv{font:400 1.5rem var(--head);white-space:nowrap}.s4tv b{font:300 2.6rem/1 var(--head)}

.s6ch.hip{background:#fff;border:1.5px dotted #8A8A8A}.s6ch.hip b{color:var(--mut)}.s6ch.att{background:var(--amb-t);border:1.5px solid var(--amb-l)}.s6ch.att b,.s6ch.att{color:#000000}

.dots{display:flex;gap:.45rem;flex:1;justify-content:center}.dots button{width:.75rem;height:.75rem;padding:0;border-radius:50%;border:2px solid var(--blue2);background:#fff;transition:all .25s}.dots button[aria-current="true"]{background:var(--blue);width:1.8rem;border-radius:999px}

@media (max-width:900px){.g4,.four{grid-template-columns:repeat(2,1fr)}.g3,.cols3{grid-template-columns:1fr}.duo{grid-template-columns:1fr}.link{width:auto;height:3rem}.link::before{border-top:0;border-left:4px dashed var(--blue2);top:0;bottom:0;left:50%;right:auto}.vs{grid-template-columns:1fr}.vs .big{font-size:clamp(2rem,4.4vw,3.8rem);white-space:nowrap}

   TEMA EDITORIAL · preto, branco, cinza e amarelo · tipografia Gotham

body.dk,.slide.dark{--bg:#0A0A0A;--card:#141414;--ink:#FFFFFF;--mut:#A3A3A3;--line:#2B2B2B;--blue:#FFFFFF;--blue2:#D9D9D9;--blue-t:#1A1A1A;--acc-d:#FFD100;--g1:#161616;--g2:#2B2B2B;--g3:#555;--g4:#8A8A8A}
html,body{font-size:17px;transition:background-color .6s ease}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:var(--bg)}
body.dk{background:#0A0A0A}
::selection{background:var(--y);color:#000}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:0;box-shadow:0 0 0 5px var(--y)}
.slide.dark{background:#0A0A0A;color:var(--ink)}

/* ---------- moldura: topo, rodapé, progresso ---------- */
.top{padding:1rem 2.2rem;background:linear-gradient(180deg,var(--bg) 55%,transparent)}
.brand{display:flex;align-items:center;gap:.85rem;font:600 .66rem var(--head);letter-spacing:.34em;color:var(--ink)}
.brand::before{content:"";display:block;width:.62rem;height:.62rem;background:var(--y)}
.prog{height:3px;background:var(--y)}
.bot{padding:1rem 2.2rem;background:linear-gradient(0deg,var(--bg) 60%,transparent)}
.dots button{width:.5rem;height:.5rem;border-radius:0;border:1px solid var(--ink);background:transparent}
.dots button[aria-current="true"]{width:2.2rem;background:var(--y);border-color:var(--ink)}
body.dk .dots button{border-color:#666}body.dk .dots button[aria-current="true"]{border-color:var(--y)}
.pos{font:500 .7rem var(--head);letter-spacing:.22em;color:var(--mut)}
.nv{height:2.7rem;padding:0 1.5rem;border-radius:0;border:1px solid var(--ink);background:transparent;color:var(--ink);font:600 .66rem var(--head);letter-spacing:.2em;text-transform:uppercase;transition:background .25s,color .25s,border-color .25s}
.nv:hover:not([disabled]){background:var(--y);border-color:var(--y);color:#000}
.nv.p{background:var(--ink);color:var(--bg)}
.nv.p:hover:not([disabled]){background:var(--y);border-color:var(--y);color:#000}

/* ---------- cabeçalho de capítulo ---------- */
.in{gap:1.5rem}
.hd{align-items:flex-end}
.step{display:none}
.hdt{display:flex;flex-direction:column;gap:1.05rem}
.kick{display:flex;align-items:center;gap:.9rem;font:600 .66rem var(--head);letter-spacing:.32em;text-transform:uppercase;color:var(--ink)}
.kick i{display:block;width:2.8rem;height:3px;background:var(--y)}
.kick em{font-style:normal;color:var(--mut);font-weight:500}
.kick em::before{content:"/";margin-right:.9rem;color:var(--g3)}
h2{font:300 clamp(2rem,4vw,3.3rem)/1.1 var(--head);letter-spacing:-.022em;color:var(--ink)}
h2 b{font-weight:700;padding:0 .1em;margin:0 -.1em;background:linear-gradient(transparent 64%,var(--y) 64%,var(--y) 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
body.dk h2 b,.slide.dark h2 b{background:none;color:var(--y)}

/* ---------- elementos base ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:0;box-shadow:none}
.big{font:300 clamp(2.4rem,6vw,5rem)/1 var(--head);letter-spacing:-.035em;color:var(--ink)}
.big.acc{display:inline-block;padding:0 .08em;background:linear-gradient(transparent 70%,var(--y) 70%,var(--y) 93%,transparent 93%)}
.acc{color:var(--ink)}
.lbl{font:600 .72rem var(--head);letter-spacing:.24em;text-transform:uppercase}
.mut,.note,.src{color:var(--mut)}
.ic svg{stroke-width:1.5}
.tag{border-radius:0;font:700 .6rem/1 var(--head);letter-spacing:.16em;text-transform:uppercase;padding:.36rem .6rem}
.tag.est,.tag.hist{background:var(--acc-t);color:#000;border-color:var(--y)}
.tag.val{color:var(--ink);background:transparent}
.tag.meta{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag.hip{color:var(--mut)}
.tag.ok{color:var(--ink)}
.leg span::before{border-radius:0}

/* botões e seletores: retangulares, linha fina */
.more,.btn,.tabs button,.seg button,.pills button,.s6l button,.hint{border-radius:0;border:1px solid var(--ink);background:transparent;color:var(--ink);font:600 .64rem var(--head);letter-spacing:.16em;text-transform:uppercase;padding:.7rem 1.2rem;transition:background .2s,color .2s,border-color .2s}
.tabs button,.pills button,.seg button,.s6l button,.btn{padding:.55rem 1rem}
.s6l button{letter-spacing:.1em;padding:.5rem .85rem}
.more:hover,.btn:hover,.tabs button:hover,.pills button:hover,.seg button:hover{background:var(--y);border-color:var(--y);color:#000}
.more:hover .ch{color:#000}
.tabs button[aria-pressed="true"],.pills button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.s6l button{border-color:var(--ink);color:var(--ink)}
.s6l button[aria-pressed="true"]{background:var(--c);border-color:var(--ink);color:var(--tc,#fff)}
.hint{border-style:solid;border-color:var(--g3);color:var(--mut);padding:.45rem .9rem;font-size:.58rem}
.hint:hover{border-color:var(--ink)}
.dtin{border:1px solid var(--ink);border-radius:0}
.dtin h3{font:600 .8rem var(--head);letter-spacing:.2em;text-transform:uppercase}

/* ---------- 01 · A mudança ---------- */
.area{border-radius:0;padding:2.1rem 2.2rem}
.area h3{font:300 1.95rem var(--head);letter-spacing:-.015em}
.area h3::after{content:"";display:block;width:2.6rem;height:3px;background:var(--y);margin-top:1rem}
.area.d{background:#0B0B0B;color:#fff}
.area.n{background:var(--g1);color:#0B0B0B;border:1px solid var(--g2)}
.chips{gap:0;margin-top:.4rem}
.chip{border-radius:0;border:0;border-top:1px solid rgba(255,255,255,.2);background:transparent;padding:1rem 0;font:400 1.2rem var(--head);letter-spacing:-.005em}
.area.n .chip{border-top-color:rgba(0,0,0,.16)}
.chip .ic{width:2.1rem;height:2.1rem}
.area.d .chip .ic{color:var(--y)}
.area.d .ic svg [fill]{fill:#0B0B0B}
.link{width:7rem}
.link::before{border-top:1px solid #0B0B0B}
.link::after{content:"";position:absolute;left:50%;top:50%;width:.7rem;height:.7rem;background:var(--y);border:1px solid #0B0B0B;transform:translate(-50%,-50%) rotate(45deg)}
.link span{top:-1.8rem;font:600 .56rem var(--head);letter-spacing:.24em;text-transform:uppercase;color:var(--ink);background:var(--bg)}
.base{border-radius:0;padding:1.05rem 1.5rem;font:600 1rem var(--body)}
.base.acc-b{background:var(--y);color:#000}
.base.acc-b .ic{color:#000!important}
.mbtn{border-radius:0;background:#000;color:#fff;box-shadow:none;font:600 .64rem var(--head);letter-spacing:.2em;text-transform:uppercase;padding:.85rem 1.4rem}
.mbtn:hover{background:#fff;color:#000;box-shadow:none;transform:none}

/* janela de detalhes */
.modal{--ink:#0B0B0B;--mut:#6B6B6B;--line:#E4E4E2;--card:#fff;--bg:#fff;--blue:#0B0B0B;--blue-t:#F3F3F1;--acc-d:#0B0B0B;--g1:#F3F3F1;--g2:#E4E4E2;--g3:#BDBDBD;--g4:#8A8A8A;color:#0B0B0B}
.mbk{background:rgba(0,0,0,.74);backdrop-filter:blur(6px)}
.mdl{border-radius:0;background:#fff;box-shadow:0 30px 90px rgba(0,0,0,.5);border-top:4px solid var(--y)}
.mhd{background:#fff;border-bottom:1px solid var(--line);padding:1.1rem 1.5rem}
.mhd h3{font:300 1.5rem var(--head);letter-spacing:-.015em;color:#0B0B0B}
.mx{border-radius:0;border:1px solid #0B0B0B;color:#000;background:#fff}
.mx:hover{background:var(--y)}
.mc{border-radius:0;border-left:4px solid var(--c);background:#fff}
.flow{border-radius:0}
.flow h4{font:600 .72rem var(--head);letter-spacing:.22em;text-transform:uppercase;color:#0B0B0B}
.fs{border-radius:0;background:var(--g1);border-top:3px solid var(--c)}
.fs .n{color:#0B0B0B;font-weight:300}
.fs b{color:#0B0B0B}
.fa{color:#0B0B0B}
.fmsg{border-radius:0;background:#0B0B0B;color:#fff;border-left:4px solid var(--y)}
.defb{border-radius:0;background:var(--g1);border-left:3px solid var(--y)}
.w{font-weight:300}
.w:hover,.w[aria-pressed="true"]{background:var(--acc-t);border-radius:0}

/* ---------- 02 · Como acontece (cronograma) ---------- */
.gtc{padding:1.7rem 1.9rem}
.gthd h3{font:600 .72rem var(--head);letter-spacing:.24em;text-transform:uppercase;color:var(--ink)}
.gt{font-size:.88rem}
.gt .m{font:600 .6rem var(--head);letter-spacing:.2em;text-transform:uppercase;border-bottom:1px solid var(--ink);padding-bottom:.45rem;color:var(--ink)}
.gt .bb{border-radius:0;font:600 .7rem/1.2 var(--head);letter-spacing:.01em}
.gt .bb.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px #000}
@keyframes bbp{0%,100%{box-shadow:0 0 0 0 rgba(255,209,0,0)}50%{box-shadow:0 0 0 6px rgba(255,209,0,.55)}}
.gtn{border-radius:0;background:var(--g1);border-left:3px solid var(--y);color:var(--mut)}
.gtn.on{color:var(--ink)}

/* ---------- 03 · O tamanho ---------- */
.hero14{border-radius:0;background:#0B0B0B;color:#fff;box-shadow:none;padding:1.5rem 2.6rem;position:relative}
.hero14::after{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--y)}
.hero14 .hn b{font-weight:300;color:var(--y);text-shadow:none;letter-spacing:-.05em}
.hero14 .hn span{font-weight:300;color:#fff;letter-spacing:-.01em}
.hero14 p{font-weight:400;font-size:1.1rem;border-left:1px solid #444;color:#E8E8E8;line-height:1.5}
.cal{border-radius:0;box-shadow:none;border:1px solid var(--line);padding:1.6rem 1.8rem 1.3rem}
.calhd h3{font:600 .72rem var(--head);letter-spacing:.24em;text-transform:uppercase}
.calhd p{color:var(--mut)}
.cnt b{font-weight:300;color:var(--ink);letter-spacing:-.04em}
.rl .mn{font:600 .62rem var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--g4)}
.rl .nd{border:1.5px solid var(--g3)}
.rl::before{background:var(--g2)}
.rl.on::before{background:var(--ink)}
.rl.on .nd{background:var(--ink);border-color:var(--ink)}
.rl.cur .nd{background:var(--y);border-color:var(--ink);box-shadow:0 0 0 5px rgba(255,209,0,.4)}
.rl.cur .mn,.rl.on .mn{color:var(--ink)}
.rw{font:600 .62rem var(--head);letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.cp{border-radius:0;border:1px dashed var(--g3);color:var(--g4);font:600 .68rem/1.15 var(--head)}
.cp.on{box-shadow:none;border:1px solid transparent}
.cp.esc.on{background:#0B0B0B;color:#fff}
.cp.ide.on{background:var(--y);color:#000}
.bc b{font-weight:300;color:var(--g4)}.bc.on b{color:var(--ink)}.bc.cur b{color:var(--ink);font-weight:700}
.cbar{border-radius:0;background:var(--g1)}
.cbar i{background:#0B0B0B}
.bc.cur .cbar i{background:var(--y)}
.calctl{border-top:1px solid var(--line)}
.calctl input,.sl input{accent-color:#0B0B0B}
.calctl b{font:600 .72rem var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}

/* ---------- 04 · Economia ---------- */
.s4g{gap:1.5rem}
.s4c{--c:#0B0B0B;border-radius:0;border:1px solid var(--line);border-top:4px solid var(--c);box-shadow:none;padding:1.5rem 1.7rem 1.4rem}
.s4c.nxt{--c:var(--y)}
.s4t{color:var(--ink);font:600 .76rem var(--head);letter-spacing:.26em;text-transform:uppercase}
.s4s{font-weight:500;color:var(--mut)}
.s4k{color:var(--ink)}
.s4k b{font-weight:300;letter-spacing:-.04em}
.s4k small{color:var(--mut)}
.s4r>span{font:600 .6rem var(--head);letter-spacing:.14em;text-transform:uppercase}
.rate{border-radius:0;background:#0B0B0B;color:#fff;font-size:.7rem}
.rate b{font-weight:300;color:var(--y)}
.s4cap{font:600 .6rem var(--head);letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.s4call{border-radius:0;background:var(--acc-t);border:1px solid var(--y);border-left:4px solid var(--y);color:#000}
.s4call b{font-weight:500}
.s4tt{border-radius:0;background:#0B0B0B;color:#fff}
.s4tt .s4tv b{color:var(--y);font-weight:300}
.s4tt.nx{background:var(--y);color:#000}
.s4tt.nx .s4tv b{color:#000}
.leg span.dash::before{border-top-color:var(--y);border-top-width:3px}

/* ---------- 05 · Investimento ---------- */
.s5c{border-radius:0;border-left:6px solid var(--c);padding:1.3rem 1.6rem}
.s5c h3{color:var(--ink);font:600 .72rem var(--head);letter-spacing:.24em;text-transform:uppercase}
.s5c .ic{color:var(--ink)}
.s5c .v{font-weight:300;letter-spacing:-.03em}
.s5t{padding:1.5rem 1.7rem}
.s5th h3{font:600 .72rem var(--head);letter-spacing:.24em;text-transform:uppercase;color:var(--ink)}
.org .nd rect{fill:#fff;stroke:var(--g3);stroke-width:1;rx:0;ry:0}
.org .nd text{font:600 12.5px var(--head);fill:var(--ink)}
.org .nd.on rect{fill:#0B0B0B;stroke:#0B0B0B}
.org .nd.on text{fill:#fff}
.org .nd:not(.on){opacity:.55}
.org .ln{stroke:var(--g4)}

/* ---------- 06 · Tecnologia ---------- */
.tkg{border-radius:0;box-shadow:none;border:1px solid var(--line)}
.tkg.open{box-shadow:none;border-color:#000}
.tkgh:hover{background:var(--g1)}
.tkic{background:#0B0B0B;border-radius:0}
.tkic .ic{color:var(--y)}
.tkgt>b{font:500 1.2rem var(--head);color:var(--ink)}
.tkbg .tkgt>b{font-weight:400;letter-spacing:-.01em}
.tksh{border-radius:0;height:.28rem;background:var(--g2)}
.tksh u{border-radius:0}
.tkgv b{font-weight:300;color:var(--ink);letter-spacing:-.02em}
.tkcv{color:var(--ink)}
.tkop{border-radius:0;background:#0B0B0B;color:#fff;font-size:.58rem;letter-spacing:.14em}
.tkop.cx{background:var(--y);color:#000}
.tkxh{font:600 .72rem var(--head);letter-spacing:.26em;text-transform:uppercase;color:var(--ink)}
.tkrh>span{font-weight:500}
.tkwc{border-radius:0;border-top:4px solid var(--c)}
.tkwc.hip{background:var(--g1)}
.tkn{color:var(--ink);font-weight:300;letter-spacing:-.04em}
.tkwc.hip .tkn{color:var(--mut)}
.tkwc h4{font:600 .78rem var(--head);letter-spacing:.14em;text-transform:uppercase}
.tkbl{border-radius:0;border-left:4px solid var(--c)}
.tkbn b::after{color:var(--ink)}
.tkbv,.tki em,.tkgv b{color:var(--ink)}
.tkd{color:var(--mut)}

/* ---------- 07 · Resultado (bolhas) ---------- */

": "ia", "b": "Acesso a modelos de IA (APIs)", "n": "OpenAI API", "v": 54000, "p": "Tokens do modelo da OpenAI. Já é a API principal em tarefas como o desenvolvimento de campanhas e complementa os demais modelos.", "r": "Campanhas e automações continuam rodando com mais de um provedor, e a troca de provedor não exige reescrever o projeto.", "y": false, "nat": "OPEX", "g": "Já está em uso na rotina de campanhas. Mantê-lo evita reescrever projetos e preserva um segundo fornecedor de peso. Representa só 6% do bloco de APIs.", "m": "Só na linha da OpenAI, o preço por milhão de tokens de entrada vai de US$ 0,05 a US$ 21 (abr/2026). A economia está em usar o modelo certo para cada tarefa.", "u": "https://fungies.io/llm-api-pricing-comparison-2026-openai-claude-gemini-deepseek/", "s": "comparativo de preços de APIs de IA, abr/2026 (fungies.io)"}, {"set": "ia", "b": "Acesso a modelos de IA (APIs)", "n": "Grok API", "v": 21600, "p": "Reserva de contingência: terceiro provedor de IA pronto para assumir se um dos principais sair do ar.", "r": "Continuidade: troca de provedor sem parar a operação. É um seguro de baixo custo para o maior item do orçamento de IA.", "y": false, "nat": "OPEX", "g": "As quatro reservas juntas (Grok, APIs chinesas, DeepSeek e Qwen) custam R$ 57,6 mil, 6% do bloco de APIs, e protegem os outros 94% (R$ 853 mil) contra indisponibilidade.", "m": "Em abr/2026, o preço por milhão de tokens de saída variava de US$ 0,40 a US$ 168 entre os modelos comparados. A escolha do fornecedor pesa muito no custo.", "u": "https://fungies.io/llm-api-pricing-comparison-2026-openai-claude-gemini-deepseek/", "s": "comparativo de preços de APIs de IA, abr/2026 (fungies.io)"}, {"set": "ia", "b": "Acesso a modelos de IA (APIs)", "n": "APIs chinesas", "v": 21600, "p": "Segunda reserva de contingência, de menor custo, contra indisponibilidade ou reajuste do provedor principal.", "r": "Continuidade e poder de negociação: quem tem alternativa pronta não fica refém de preço.", "y": false, "nat": "OPEX", "g": "Garante uma alternativa barata já testada. Sem ela, um reajuste ou uma queda do provedor principal vira parada de operação ou conta maior.", "m": "O DeepSeek V3.2 entrega cerca de 90% do desempenho dos modelos de ponta a cerca de 10% do custo (abr/2026).", "u": "https://fungies.io/llm-api-pricing-comparison-2026-openai-claude-gemini-deepseek/", "s": "comparativo de preços de APIs de IA, abr/2026 (fungies.io)"}, {"set": "ia", "b": "Acesso a modelos de IA (APIs)", "n": "DeepSeek API", "v": 7200, "p": "Modelo de custo muito baixo, para tarefas de rotina e menor criticidade. Custa cerca de R$ 600 por mês.", "r": "Menor custo médio por tarefa. O que não precisa de modelo de ponta deixa de consumir verba de modelo de ponta.", "y": false, "nat": "OPEX", "g": "É o item de maior alavanca de custo do bloco: pouco dinheiro absorve tarefas que, em modelos de ponta, custariam várias vezes mais.", "m": "DeepSeek V3.2: US$ 0,28 por milhão de tokens de entrada e US$ 0,42 de saída, contra US$ 3 e US$ 15 do Claude Sonnet 4.6 (abr/2026).", "u": "https://fungies.io/llm-api-pricing-comparison-2026-openai-claude-gemini-deepseek/", "s": "comparativo de preços de APIs de IA, abr/2026 (fungies.io)"}, {"set": "ia", "b": "Acesso a modelos de IA (APIs)", "n": "Qwen API", "v": 7200, "p": "Segundo fornecedor de baixo custo para rotina, com modelo aberto como alternativa.", "r": "Preço sob concorrência e continuidade, com custo de R$ 600 por mês.", "y": false, "nat": "OPEX", "g": "Mantém duas opções baratas competindo entre si. Isso segura o preço e evita depender de um único fornecedor de baixo custo.", "m": "Testes de roteamento mostram que enviar as tarefas simples a modelos baratos reduz o custo de 35% a mais de 85%, mantendo 95% do desempenho.", "u": "https://lmsys.org/blog/2024-07-01-routellm/", "s": "LMSYS · RouteLLM, 2024"}, {"set": "ia", "b": "Servidores e nuvem dos projetos de IA", "n": "Máquina virtual (DCC)", "v": 226800, "p": "Servidor na nuvem que hosped function setDt(id,open){const b=$(`[data-dt="${id}"]`),d=$('#dt-'+id);if(!b)return;b.setAttribute('aria-expanded',open);d.classList.toggle('open',open);$('.lb',b).textContent=open?'Recolher':'Ver detalhes';}
stage.addEventListener('click',e=>{if(e.target.closest('[data-modal]')){openModal();return;}const m=e.target.closest('.more');if(m){const id=m.dataset.dt,op=m.getAttribute('aria-expanded')!=='true';setDt(id,op);if(op)setTimeout(()=>m.scrollIntoView({behavior:'smooth',block:'start'}),60);return;}
 const t=e.target.closest('.tabs button');if(t){const box=t.closest('.dtin');$$('.tabs button',box).forEach(x=>x.setAttribute('aria-pressed',x===t));$$('.pn',box).forEach(p=>p.classList.toggle('on',p.dataset.pn===t.dataset.p));}});

document.addEventListener('keydown',e=>{if(!modal.hidden){if(e.key==='Escape'){closeModal();}else if(e.key==='Tab'){const f=$$('button,[href],input',modal).filter(x=>!x.disabled);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}return;}if(e.altKey||e.ctrlKey||e.metaKey)return;const t=e.target.tagName;if((t==='INPUT'&&e.target.type!=='range'&&e.target.type!=='checkbox')||t==='SELECT')return;if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);});
let tx=null;stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});stage.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>100&&!e.target.closest('input,svg,.cg,.gt,.tw'))go(cur+(dx<0?1:-1));},{passive:true});
window.addEventListener('hashchange',()=>go((parseInt(location.hash.slice(1),10)||1)-1,false));
const fitCur=()=>{if(cur>=0)fitSlide(DECK[cur].el);};
window.addEventListener('resize',fitCur);
if(window.ResizeObserver){const ro=new ResizeObserver(()=>{if(!fitLock&&cur>=0)requestAnimationFrame(fitCur);});DECK.forEach(x=>{const n=x.el.querySelector('.in');if(n)ro.observe(n);});}
go(Math.min(DECK.length-1,Math.max(0,(parseInt(location.hash.slice(1),10)||1)-1)),false);
})();

</script>
